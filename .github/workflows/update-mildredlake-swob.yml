name: Update Mildred Lake SWOB (CWMX)

on:
  schedule:
    # hourly (at minute 7)
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Mildred Lake SWOB XML
        run: |
          mkdir -p data
          curl -fsSL "https://dd.weather.gc.ca/today/observations/swob-ml/latest/CWMX-AUTO-swob.xml" \
            -o "data/mildredlake_swob.xml"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mildredlake_swob.xml
          git commit -m "Update Mildred Lake SWOB" || echo "No changes"
          git push
