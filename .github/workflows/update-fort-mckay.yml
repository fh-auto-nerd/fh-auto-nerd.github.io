name: Update Fort McKay / Mildred Lake Weather XML

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}

jobs:
  update-xml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest Mildred Lake XML
          run: |
            set -e
            BASE_DIR_URL="https://dd.weather.gc.ca/today/citypage_weather/AB/01/"
            SITE_CODE="s0000523"
            LANG="en"
        
            echo "Fetching index from $BASE_DIR_URL"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
              "$BASE_DIR_URL" -o index.html
        
            FILE=$(grep -oE "[0-9TZ\.]+_MSC_CitypageWeather_${SITE_CODE}_${LANG}\.xml" index.html | sort | tail -n 1)
        
            if [ -z "$FILE" ]; then
              echo "No matching files found for ${SITE_CODE}"
              exit 1
            fi
        
            LATEST_URL="${BASE_DIR_URL}${FILE}"
            echo "Latest URL: $LATEST_URL"
        
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
              "$LATEST_URL" -o fort_mckay.xml

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add fort_mckay.xml
          git commit -m "Update Mildred Lake (s0000523) XML"
          git push
